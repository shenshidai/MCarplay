name: Build iOS IPA (No Mac Required)
on:
push:
branches: [ main, master ]
workflow_dispatch:
jobs:
build-ios:
name: Build Unsigned MCarplay IPA
runs-on: macos-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Install XcodeGen
run: brew install xcodegen
- name: Generate Xcode Project Spec and Info.plist
run: |
cat << 'EOF' > Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
<key>CFBundleDevelopmentRegion</key>
<string>(DEVELOPMENT_LANGUAGE)</string>
<key>CFBundleExecutable</key>
<string>(EXECUTABLE_NAME)</string>
<key>CFBundleIdentifier</key>
<string>(PRODUCT_BUNDLE_IDENTIFIER)</string>
<key>CFBundleInfoDictionaryVersion</key>
<string>6.0</string>
<key>CFBundleName</key>
<string>(PRODUCT_NAME)</string>
<key>CFBundlePackageType</key>
<string>APPL</string>
<key>CFBundleShortVersionString</key>
<string>1.0</string>
<key>CFBundleVersion</key>
<string>1</string>
<key>LSRequiresIPhoneOS</key>
<true/>
<key>NSLocationWhenInUseUsageDescription</key>
<string>用于在CarPlay车载桌面显示实时导航地图</string>
<key>NSLocalNetworkUsageDescription</key>
<string>用于通过WiFi热点连接23款蒙迪欧车机亿连系统</string>
<key>NSAppleMusicUsageDescription</key>
<string>用于在CarPlay桌面同步显示与控制正在播放的音乐</string>
<key>UIBackgroundModes</key>
<array>
<string>audio</string>
<string>location</string>
<string>fetch</string>
</array>
<key>UIApplicationSceneManifest</key>
<dict>
<key>UIApplicationSupportsMultipleScenes</key>
<false/>
</dict>
<key>UILaunchScreen</key>
<dict/>
<key>UISupportedInterfaceOrientations</key>
<array>
<string>UIInterfaceOrientationPortrait</string>
<string>UIInterfaceOrientationLandscapeLeft</string>
<string>UIInterfaceOrientationLandscapeRight</string>
</array>
</dict>
</plist>
EOF
cat << 'EOF' > project.yml
name: MCarplay
options:
bundleIdPrefix: com.mondeo.carplay
targets:
MCarplay:
type: application
platform: iOS
deploymentTarget: "16.0"
sources: [Sources]
info:
path: Info.plist
settings:
base:
PRODUCT_BUNDLE_IDENTIFIER: com.mondeo.mcarplay.app
GENERATE_INFOPLIST_FILE: NO
EOF
xcodegen generate
- name: Build Unsigned App Archive
run: |
xcodebuild build 
-project MCarplay.xcodeproj 
-scheme MCarplay 
-configuration Release 
-sdk iphoneos 
-destination 'generic/platform=iOS' 
CODE_SIGN_IDENTITY="" 
CODE_SIGNING_REQUIRED=NO 
CODE_SIGNING_ALLOWED=NO 
CONFIGURATION_BUILD_DIR=build
- name: Package into IPA
run: |
mkdir -p Payload
cp -r build/MCarplay.app Payload/
zip -r MCarplay-Unsigned.ipa Payload
- name: Upload IPA Artifact
uses: actions/upload-artifact@v4
with:
name: MCarplay-Unsigned
path: MCarplay-Unsigned.ipa
